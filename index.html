<h1>Ley ohm</h1>
<p>V=R*I </p>
<p>V=Voltaje</p>
<p>R=Resistencia</p>
<p>I= Corriente</p>
  
<p>Esta ley sirve para relacionar el voltaje con la corriente y resistencia electrica</p>
<h1>Ley watt</h1>
<p> P=V*I </p>
<p>P=Potencia</p>
<p>V=Voltaje</p>
<p>I= Corriente</p>
<h1>Efecto Joule</h1>
<p> P=I(Va-Vb) </p>
<p>P=Energia calorica</p>
<p>I= Corriente</p>
<p>Va=Voltaje inicial</p>
<p>Vb=Voltaje final</p>
